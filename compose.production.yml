services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: uimm_diagnostic_db
      POSTGRES_USER: uimm_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    volumes:
      - uimm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uimm_user -d uimm_diagnostic_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://uimm_user:${POSTGRES_PASSWORD:?Required}@db:5432/uimm_diagnostic_db
      SECRET_KEY: ${SECRET_KEY:?Required}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      AI_PROVIDER: azure
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:?Required}
      AZURE_OPENAI_MODEL: ${AZURE_OPENAI_MODEL:?Required}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:?Required}
    volumes:
      - ./Backend/generated_reports:/app/generated_reports
      - ./Backend/ml_artifacts:/app/ml_artifacts

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

volumes:
  uimm_postgres_data:
